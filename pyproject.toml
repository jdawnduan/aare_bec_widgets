[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aare_bec_widgets"
version = "0.0.0"
description = "A plugin repository for BEC"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # AareDAQ GUI (aare_bec_widgets/aare_gui), copied from AareDAQ origin/main 1.3.8: same deps as its gui half.
    # aarecommon / aaredb come from the PSI index (see [[tool.uv.index]]); jfjoch_client is on PyPI too.
    "aarecommon>=0.9.0",
    "aaredb>=0.83.1",
    "jfjoch_client>=1.0.0rc166",
    "pyJWT",
    "pyzmq",
    # headless, same as AareDAQ: a dependency already pulls opencv-python-headless, and two cv2 providers in
    # one venv give a half-installed cv2 (install-order dependent). If a dep ever drags in opencv-python,
    # override it away like AareDAQ does ([tool.uv] override-dependencies).
    "opencv-python-headless",
    "numpy",
    "matplotlib>=3.10.3",
    "requests",
]

[project.optional-dependencies]
dev = [
    "black",
    "copier",
    "isort",
    "coverage",
    "pylint",
    "pytest",
    "pytest-random-order",
    "pytest-qt",
    "pytest-mock",
    "pytest-timeout",
    "ophyd_devices",
    "bec_server",
]

[project.entry-points."bec"]
plugin_bec = "aare_bec_widgets"

[project.entry-points."bec.deployment.device_server"]
plugin_ds_startup = "aare_bec_widgets.deployments.device_server.startup:run"

[project.entry-points."bec.file_writer"]
plugin_file_writer = "aare_bec_widgets.file_writer"

[project.entry-points."bec.file_writer.storage_copy"]
plugin_storage_copy = "aare_bec_widgets.file_writer.storage_copy:plugin_storage_copy"

[project.entry-points."bec.scans"]
plugin_scans = "aare_bec_widgets.scans"

[project.entry-points."bec.scans.scan_modifier"]
plugin_scan_modifier = "aare_bec_widgets.scans.scan_customization.scan_modifier"

[project.entry-points."bec.scans.metadata_schema"]
plugin_metadata_schema = "aare_bec_widgets.scans.metadata_schema"

[project.entry-points."bec.ipython_client_startup"]
plugin_ipython_client_pre = "aare_bec_widgets.bec_ipython_client.startup.pre_startup"
plugin_ipython_client_post = "aare_bec_widgets.bec_ipython_client.startup"

[project.entry-points."bec.widgets.auto_updates"]
plugin_widgets_update = "aare_bec_widgets.bec_widgets.auto_updates"

[project.entry-points."bec.widgets.user_widgets"]
plugin_widgets = "aare_bec_widgets.bec_widgets.widgets"

# PSI package index for aarecommon / aaredb. `uv pip install` from another cwd does not read this,
# so dev.sh / Dockerfile.rhel9 also pass it via UV_EXTRA_INDEX_URL.
[[tool.uv.index]]
name = "psi"
url = "https://gitea.psi.ch/api/packages/mx/pypi/simple"

[tool.uv.sources]
aarecommon = { index = "psi" }
aaredb = { index = "psi" }

[tool.hatch.build.targets.wheel]
include = ["*"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true

[tool.black]
line-length = 100
skip-magic-trailing-comma = true

[tool.pylint.basic]
# Good variable names regexes, separated by a comma. If names match any regex,
# they will always be accepted
good-names-rgxs = [
    ".*scanID.*",
    ".*RID.*",
    ".*pointID.*",
    ".*ID.*",
    ".*_2D.*",
    ".*_1D.*",
]
